name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reject tracked ignored files
        shell: bash
        run: |
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$tracked_ignored" ]]; then
            printf '%s\n' "$tracked_ignored"
            exit 1
          fi
      - name: Compile component
        run: python -m compileall -q custom_components/congmodbus extras/homekit_climate_proxy
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # The repository owner has not selected an open-source license.
          # Ignore that publication-policy check without implying a license.
          ignore: brands license
