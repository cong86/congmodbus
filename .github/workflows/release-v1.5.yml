name: Publish v1.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.5.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'cong86/congmodbus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source
        run: python -m unittest discover -s tests -q
      - name: Build complete bundle
        run: python scripts/build_release.py dist/congmodbus-v1.5-full.zip
      - name: Publish tag, release and bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5 dist/congmodbus-v1.5-full.zip \
            --target "$GITHUB_SHA" \
            --title "Cong Modbus Climate v1.5" \
            --notes-file RELEASE-v1.5.md \
            --latest
